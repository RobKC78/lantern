name: Validate and package Lantern
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh
      - name: Windows portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -PortableOnly
      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-${{ runner.os }}
          path: dist/
